{% extends 'form.html' %}
{% load static %}
{% block assets_form %}
    <script src="{% static 'lib/select2-4.0.13/js/select2.min.js' %}"></script>
    <script src="{% static 'lib/select2-4.0.13/js/i18n/es.js' %}"></script>
    <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2-bootstrap4.min.css' %}">
    <link rel="stylesheet" href="{% static 'lib/bootstrap-touchspin-4.2.5/css/jquery.bootstrap-touchspin.css' %}"/>
    <script src="{% static 'lib/bootstrap-touchspin-4.2.5/js/jquery.bootstrap-touchspin.js' %}"></script>
    <script src="{% static 'client_service_rate/js/form.js' %}"></script>
{% endblock %}

{% block form_fields %}
<div class="row g-3">
    <div class="col-md-12 col-lg-12">
        <label class="form-label fw-bold">{{ form.client.label }}</label>
        {{ form.client }}
    </div>
    <div class="col-md-6 col-lg-6">
        <label class="form-label fw-bold">{{ form.service_type.label }}</label>
        {{ form.service_type }}
    </div>
    <div class="col-md-6 col-lg-6">
        <label class="form-label fw-bold">{{ form.product.label }}</label>
        {{ form.product }}
    </div>
    <div class="col-md-6 col-lg-4">
        <label class="form-label fw-bold">{{ form.price.label }}</label>
        {{ form.price }}
    </div>
    <div class="col-md-6 col-lg-4 d-flex align-items-center">
        <div class="form-check form-switch mt-4">
            {{ form.is_active }}
            <label class="form-check-label fw-bold" for="{{ form.is_active.id_for_label }}">{{ form.is_active.label }}</label>
        </div>
    </div>
</div>
{% endblock %}
