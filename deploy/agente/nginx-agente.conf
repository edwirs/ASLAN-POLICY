# Pegar DENTRO de cada bloque «server { … }» con «listen 443 ssl» de nginx (el del dominio de las empresas,
# *.aslan-multiagente.com), junto a los demás «location». Luego: sudo nginx -t && sudo systemctl reload nginx

    # Agente ASLAN: conexiones WebSocket de los PC de las oficinas hacia el relevo (solo /agente/ws/; el resto del relevo
    # —/interno/, que usan los bots— NO se publica).
    location /agente/ws/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 0;
    }

    # Instalador del agente (se copia con scp a /home/edwin/aslan-multiagente/descargas/).
    location /descargas/ {
        alias /home/edwin/aslan-multiagente/descargas/;
        autoindex off;
    }
